<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma liste de Noël 🎄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a1f18;
      --bg-card: rgba(22, 45, 36, 0.7);
      --gold: #d4af37;
      --gold-bright: #ffe58f;
      --red-ribbon: #c41e3a;
      --white-snow: #f8f9fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #153a2d 0%, var(--bg-deep) 75%);
      color: var(--white-snow);
      font-family: 'Cinzel', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    #snow {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }

    .container { position: relative; z-index: 2; width: 100%; max-width: 1100px; text-align: center; }

    .hero { margin-bottom: 2.8rem; }

    .santa {
      width: clamp(180px, 26vw, 320px);
      height: auto; display: block;
      margin: 0 auto -1rem;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
    }

    h1 {
      font-family: 'Mountains of Christmas', cursive;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      color: var(--gold-bright);
      text-shadow: 0 0 22px rgba(212, 175, 55, 0.55), 0 3px 6px rgba(0, 0, 0, 0.5);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(248, 249, 250, 0.75);
    }

    .divider {
      width: min(340px, 70%);
      height: 2px; margin: 1.4rem auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 2px;
    }

    /* ====== GRILLE DES CADEAUX ====== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1.6rem;
    }

    .card {
      position: relative;
      display: flex; flex-direction: column;
      background: var(--bg-card);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      animation: pop 0.5s ease backwards;
    }

    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.15s; }
    .card:nth-child(3) { animation-delay: 0.25s; }
    .card:nth-child(4) { animation-delay: 0.35s; }
    .card:nth-child(5) { animation-delay: 0.45s; }
    .card:nth-child(6) { animation-delay: 0.55s; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(22px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.25);
      border-color: var(--gold);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: rgba(0, 0, 0, 0.25);
    }

    .card-nom {
      padding: 1rem 1rem 0.4rem;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .card-prix {
      align-self: flex-start;
      margin: 0 1rem 1.1rem;
      padding: 0.25rem 0.8rem;
      background: linear-gradient(135deg, var(--gold), #b8912a);
      color: #1a1206;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.4);
    }

    /* Ruban de Noël en haut de chaque carte */
    .card::before {
      content: "🎁";
      position: absolute;
      top: 0.7rem; left: 0.7rem;
      font-size: 1.3rem;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      z-index: 2;
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: rgba(248, 249, 250, 0.5);
    }
  </style>
</head>
<body>

  <canvas id="snow"></canvas>

  <div class="container">
    <header class="hero">
      <!-- Mets ton image du père Noël ici (ou supprime la ligne si tu n'en veux pas) -->
      <img src="pere-noel.png" alt="Père Noël" class="santa">
      <h1>Ma liste de Noël</h1>
      <p class="subtitle">Clique sur un cadeau pour le découvrir 🎁</p>
      <div class="divider"></div>
    </header>

    <main class="grid" id="grid">
      <!-- Les cadeaux s'affichent ici automatiquement -->
    </main>

    <p class="footer">Ho ho ho, joyeuses fêtes ! 🎅✨</p>
  </div>

  <!-- ====== TA LISTE DE CADEAUX (fichier séparé) ====== -->
  <script src="cadeaux.js"></script>

  <script>
    // ====== AFFICHAGE DES CADEAUX ======
    const grid = document.getElementById('grid');

    CADEAUX.forEach(cadeau => {
      const carte = document.createElement('a');
      carte.className = 'card';
      carte.href = cadeau.lien;
      carte.target = '_blank';   // Ouvre dans un nouvel onglet
      carte.rel = 'noopener';

      const img = document.createElement('img');
      img.className = 'card-image';
      img.src = cadeau.image;
      img.alt = cadeau.nom;
      img.loading = 'lazy';

      const nom = document.createElement('span');
      nom.className = 'card-nom';
      nom.textContent = cadeau.nom;

      carte.append(img, nom);

      if (cadeau.prix) {
        const prix = document.createElement('span');
        prix.className = 'card-prix';
        prix.textContent = cadeau.prix;
        carte.appendChild(prix);
      }

      grid.appendChild(carte);
    });

    // ====== ANIMATION DE NEIGE ======
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');

    let flocons = [];

    function redimensionner() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', redimensionner);
    redimensionner();

    function creerFlocon() {
      return {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        rayon: Math.random() * 3 + 1,
        vitesse: Math.random() * 1 + 0.4,
        derive: Math.random() * 1 - 0.5
      };
    }

    const NOMBRE_FLOCONS = 120;
    for (let i = 0; i < NOMBRE_FLOCONS; i++) {
      flocons.push(creerFlocon());
    }

    function animer() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';

      flocons.forEach(flocon => {
        flocon.y += flocon.vitesse;
        flocon.x += flocon.derive;

        if (flocon.y > canvas.height + 5) {
          flocon.y = -5;
          flocon.x = Math.random() * canvas.width;
        }
        if (flocon.x > canvas.width + 5) flocon.x = -5;
        if (flocon.x < -5) flocon.x = canvas.width + 5;

        ctx.beginPath();
        ctx.arc(flocon.x, flocon.y, flocon.rayon, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(animer);
    }
    animer();
  </script>
</body>
</html>
