<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma liste de Noël 🎄</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a1f18;
      --bg-card: rgba(22, 45, 36, 0.7);
      --gold: #d4af37;
      --gold-bright: #ffe58f;
      --red-ribbon: #c41e3a;
      --white-snow: #f8f9fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #153a2d 0%, var(--bg-deep) 75%);
      color: var(--white-snow);
      font-family: 'Cinzel', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
    }

    #snow {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }

    .container { position: relative; z-index: 2; width: 100%; max-width: 1100px; text-align: center; }

    .hero { margin-bottom: 2.8rem; }

    .santa {
      width: clamp(180px, 26vw, 320px);
      height: auto; display: block;
      margin: 0 auto -1rem;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
    }

    h1 {
      font-family: 'Mountains of Christmas', cursive;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      color: var(--gold-bright);
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.45), 0 4px 10px rgba(0, 0, 0, 0.7);
      letter-spacing: 1px;
    }

    .sous-titre { color: #c9d8d0; margin-top: 0.5rem; font-size: 1rem; }

    /* --- GRILLE DES CADEAUX --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 450px) { .grid { grid-template-columns: 1fr; } }

    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    /* Ruban vertical du cadeau */
    .card::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 10px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #e63946, var(--red-ribbon));
      box-shadow: 0 0 8px rgba(196, 30, 58, 0.4);
      opacity: 0.85;
      pointer-events: none;
    }

    /* Ruban horizontal par-dessus l'image */
    .card::after {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 10px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, #e63946, var(--red-ribbon));
      box-shadow: 0 0 8px rgba(196, 30, 58, 0.4);
      opacity: 0.85;
      pointer-events: none;
    }

    /* Prix en badge doré au coin */
    .card-prix {
      position: absolute;
      top: 10px; right: 10px;
      z-index: 3;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      background: radial-gradient(circle, var(--gold-bright) 0%, var(--gold) 100%);
      color: #3b2204;
      font-weight: 700;
      font-size: 0.85rem;
      border: 2px solid #fff3c4;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
    }

    .card-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .card-nom {
      padding: 0.9rem 0.8rem 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--gold-bright);
      background: rgba(10, 31, 24, 0.6);
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--gold-bright);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5),
                  0 0 25px rgba(212, 175, 55, 0.45);
    }

    .apercu { margin-top: 2rem; color: #c9d8d0; font-size: 0.8rem; }
  </style>
</head>
<body>
  <canvas id="snow"></canvas>

  <div class="container">
    <div class="hero">
      <img class="santa" src="pere-noel.png" alt="Père Noël">
      <h1>Ma liste de Noël 🎁</h1>
      <p class="sous-titre">Clique sur un cadeau pour voir où le trouver !</p>
    </div>

    <div class="grid" id="grid"></div>

    <p class="apercu">🎄 Il reste encore de la place sous le sapin…</p>
  </div>

  <script>
    // ====== ANIMATION DE NEIGE ======
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const flakes = Array.from({ length: 55 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2.5 + 1,
      speed: Math.random() * 0.9 + 0.4,
      sway: Math.random() * 0.02
    }));

    function loop() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      flakes.forEach(f => {
        f.y += f.speed;
        f.x += Math.sin(f.y * f.sway) * 0.4;
        if (f.y > height) { f.y = -5; f.x = Math.random() * width; }
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(loop);
    }
    loop();

    // ====== MA LISTE DE CADEAUX ======
    // 👉 C'EST ICI QUE TU AJOUTES TES CADEAUX !
    // - nom  : le nom du cadeau
    // - image : le lien de la photo du produit
    // - lien : l'adresse du site où l'acheter
    // - prix : (optionnel) le prix affiché
    const CADEAUX = [
      {
        nom: "Chaussettes Jimmy Lion 🦊",
        image: "https://exemple.com/chaussettes.jpg",
        lien: "https://www.jimmylion.com/chaussettes",
        prix: "12 €"
      },
      {
        nom: "Exemple cadeau 2",
        image: "https://exemple.com/photo.jpg",
        lien: "https://exemple.com",
        prix: "25 €"
      }
      // Ajoute autant de cadeaux que tu veux ici 👇
    ];

    // ====== AFFICHAGE DES CADEAUX ======
    const grid = document.getElementById('grid');

    CADEAUX.forEach(cadeau => {
      const carte = document.createElement('a');
      carte.className = 'card';
      carte.href = cadeau.lien;
      carte.target = '_blank';   // Ouvre dans un nouvel onglet
      carte.rel = 'noopener';

      const img = document.createElement('img');
      img.className = 'card-image';
      img.src = cadeau.image;
      img.alt = cadeau.nom;
      img.loading = 'lazy';

      const nom = document.createElement('span');
      nom.className = 'card-nom';
      nom.textContent = cadeau.nom;

      carte.append(img, nom);

      if (cadeau.prix) {
        const prix = document.createElement('span');
        prix.className = 'card-prix';
        prix.textContent = cadeau.prix;
        carte.appendChild(prix);
      }

      grid.appendChild(carte);
    });
  </script>
</body>
</html>
