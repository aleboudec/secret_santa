<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Santa de la famille Le Boudec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a1f18;
      --bg-card: rgba(22, 45, 36, 0.7);
      --gold: #d4af37;
      --gold-bright: #ffe58f;
      --red-ribbon: #c41e3a;
      --white-snow: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #153a2d 0%, var(--bg-deep) 75%);
      color: var(--white-snow);
      font-family: 'Cinzel', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    #snow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    /* --- PÈRE NOËL + TITRE --- */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2.8rem;
    }

    /* Barre dorée : derrière le père Noël */
    .hero::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: min(90%, 900px);
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      z-index: 2;
      top: calc(clamp(220px, 34vw, 420px) * 0.59 - 1.2rem);
    }

    .santa {
      width: clamp(220px, 34vw, 420px);
      height: auto;
      display: block;
      position: relative;
      z-index: 3;
      margin-bottom: -1.2rem;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
    }

    h1 {
      position: relative;
      z-index: 1;
      font-family: 'Mountains of Christmas', cursive;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      color: var(--gold-bright);
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.45), 0 4px 10px rgba(0, 0, 0, 0.7);
      letter-spacing: 1px;
    }

    /* --- GRILLE 3 x 2 --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 400px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      position: relative;
      height: 180px;
      background: var(--bg-card);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, opacity 0.3s ease, filter 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Rubans de cadeau */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 14px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #e63946, var(--red-ribbon));
      box-shadow: 0 0 8px rgba(196, 30, 58, 0.4);
      transition: background 0.3s ease;
    }

    .card::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 14px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, #e63946, var(--red-ribbon));
      box-shadow: 0 0 8px rgba(196, 30, 58, 0.4);
      transition: background 0.3s ease;
    }

    .card-badge {
      position: relative;
      z-index: 3;
      padding: 0.5rem 0.8rem;
      min-width: 70px;
      border-radius: 20px;
      background: radial-gradient(circle, var(--gold-bright) 0%, var(--gold) 100%);
      color: #3b2204;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid #fff3c4;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
      transition: transform 0.25s ease, filter 0.3s ease;
    }

    /* Effet surbrillance */
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--gold-bright);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5),
                  0 0 25px rgba(212, 175, 55, 0.45),
                  inset 0 0 18px rgba(212, 175, 55, 0.2);
    }

    .card:hover .card-badge {
      transform: scale(1.1) rotate(3deg);
      box-shadow: 0 0 18px var(--gold-bright);
    }

    /* --- CASE DÉJÀ OUVERTE (GRISÉE) --- */
    .card.opened {
      opacity: 0.45;
      filter: grayscale(100%);
      background: rgba(40, 40, 40, 0.8);
      border-color: rgba(255, 255, 255, 0.15);
      transform: none !important;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3) !important;
    }

    .card.opened::before,
    .card.opened::after {
      background: #555;
      box-shadow: none;
    }

    .card.opened .card-badge {
      background: #777;
      color: #222;
      border-color: #999;
      box-shadow: none;
      transform: none !important;
    }

    /* --- POPUP RÉSULTAT --- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1.5rem;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: linear-gradient(145deg, #153a2d, #0a1f18);
      border: 2px solid var(--gold);
      border-radius: 18px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
    }

    .modal-intro {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--white-snow);
    }

    .modal-name {
      font-family: 'Mountains of Christmas', cursive;
      font-size: 3.2rem;
      color: var(--gold-bright);
      margin-bottom: 2rem;
      text-shadow: 0 0 15px rgba(255, 229, 143, 0.5);
    }

    .modal-close {
      background: var(--red-ribbon);
      color: white;
      border: none;
      padding: 0.7rem 2rem;
      border-radius: 999px;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      cursor: pointer;
    }

    .modal-close:hover {
      filter: brightness(1.15);
    }
  </style>
</head>
<body>
  <canvas id="snow"></canvas>

  <div class="container">
    <div class="hero">
      <img class="santa" src="pere-noel.png" alt="Père Noël">
      <h1>Secret Santa de la famille Le Boudec</h1>
    </div>

    <div class="grid">
      <div class="card" data-id="maman" aria-label="Case Maman"><span class="card-badge">Maman</span></div>
      <div class="card" data-id="alain" aria-label="Case Alain"><span class="card-badge">Alain</span></div>
      <div class="card" data-id="alan" aria-label="Case Alan"><span class="card-badge">Alan</span></div>
      <div class="card" data-id="gaetan" aria-label="Case Gaetan"><span class="card-badge">Gaetan</span></div>
      <div class="card" data-id="antony" aria-label="Case Antony"><span class="card-badge">Antony</span></div>
      <div class="card" data-id="melissa" aria-label="Case Mélissa"><span class="card-badge">Mélissa</span></div>
    </div>
  </div>

  <!-- Popup résultat -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <p class="modal-intro" id="modal-intro"></p>
      <p class="modal-name" id="modal-name"></p>
      <button class="modal-close" id="modal-close">Fermer</button>
    </div>
  </div>

  <script>
    // Animation de neige
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const flakes = Array.from({ length: 55 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 2.5 + 1,
      speed: Math.random() * 0.9 + 0.4,
      sway: Math.random() * 0.02
    }));

    function loop() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      flakes.forEach(f => {
        f.y += f.speed;
        f.x += Math.sin(f.y * f.sway) * 0.4;
        if (f.y > height) {
          f.y = -5;
          f.x = Math.random() * width;
        }
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(loop);
    }
    loop();
  </script>

  <!-- Logique Firebase + Secret Santa -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOWgeaDMcc8Uug5oeRcb6jK2pafAm77zk",
      authDomain: "secret-santa-74ad7.firebaseapp.com",
      databaseURL: "https://secret-santa-74ad7-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "secret-santa-74ad7",
      storageBucket: "secret-santa-74ad7.firebasestorage.app",
      messagingSenderId: "562027077962",
      appId: "1:562027077962:web:5572eb7835d98bcfe7a1b3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Participants : id (data-id des cartes) -> nom affiché
    const participants = {
      maman:   "Maman",
      alain:   "Alain",
      alan:    "Alan",
      gaetan:  "Gaetan",
      antony:  "Antony",
      melissa: "Mélissa"
    };

    const cards = document.querySelectorAll('.card');
    const modal = document.getElementById('modal');
    const modalIntro = document.getElementById('modal-intro');
    const modalName = document.getElementById('modal-name');

    document.getElementById('modal-close').addEventListener('click', () => {
      modal.classList.remove('show');
    });

    // Mélange (Fisher-Yates)
    function melanger(tableau) {
      const t = [...tableau];
      for (let i = t.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [t[i], t[j]] = [t[j], t[i]];
      }
      return t;
    }

    // Génère un tirage complet en cercle : personne ne tombe sur lui-même,
    // chaque personne donne à 1 seule et reçoit de 1 seule. Zéro blocage possible.
    function genererTirage() {
      const ids = melanger(Object.keys(participants));
      const tirage = {};
      for (let i = 0; i < ids.length; i++) {
        tirage[ids[i]] = ids[(i + 1) % ids.length];
      }
      return tirage;
    }

    // Griser en temps réel les cases déjà ouvertes
    onValue(ref(db, 'ouvertes'), (snapshot) => {
      const data = snapshot.val() || {};
      cards.forEach(card => {
        const id = card.getAttribute('data-id');
        card.classList.toggle('opened', data[id] === true);
      });
    });

    function afficher(id, cibleId) {
      modalIntro.textContent = `${participants[id]}, tu offres un cadeau à :`;
      modalName.textContent = participants[cibleId];
      modal.classList.add('show');
    }

    // Création du tirage (une seule fois, de façon atomique)
    async function assurerTirage() {
      await runTransaction(ref(db, 'tirage'), (actuel) => {
        if (actuel) return actuel; // déjà créé, on ne touche à rien
        return genererTirage();
      });
    }

    cards.forEach(card => {
      card.addEventListener('click', async () => {
        const id = card.getAttribute('data-id');

        try {
          // S'assure que le tirage existe
          await assurerTirage();

          // Récupère le résultat de cette personne
          const snap = await get(ref(db, 'tirage/' + id));
          const cibleId = snap.val();
          if (!cibleId) return;

          // Si la case a déjà été ouverte, on demande confirmation avant de ré-afficher
          const dejaOuverte = card.classList.contains('opened');
          if (dejaOuverte) {
            if (!confirm("Tu as déjà ouvert ta case. Veux-tu revoir ton résultat ?")) return;
          } else {
            // Marque la case comme ouverte
            await runTransaction(ref(db, 'ouvertes/' + id), () => true);
          }

          afficher(id, cibleId);
        } catch (err) {
          console.error(err);
          alert("Une erreur est survenue, réessaie dans un instant.");
        }
      });
    });
  </script>
</body>
</html>
